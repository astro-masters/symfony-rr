services:
  api:
    image: ${APP_IMAGE:-ghcr.io/${GHCR_OWNER}/project-api:prod}
    working_dir: /var/www/api
    env_file:
      - ./.env
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    command:
      - sh
      - /usr/local/bin/start.sh
